[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "../netlify/functions"
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888